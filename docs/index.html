      color: #8e8e96; font: 11px monospace;
      pointer-events: none;
    }

      color: #8e8e96; font: 20px monospace;
      cursor: pointer;
      z-index: 5;
      -webkit-tap-highlight-color: transparent;
    }

      color: #ffe000; font: 13px monospace;
      opacity: 0; transition: opacity 0.4s;
      pointer-events: none;
    }

      position: fixed; top: 20%; left: 0; right: 0;
      text-align: center;
      color: #ff4444; font: bold 22px monospace;
      opacity: 0; transition: opacity 0.3s;
      pointer-events: none;
    }
    #deadlock { color: #ff9900; }

    /* Menu overlay */
    #menu {
      position: fixed; inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.78);
      z-index: 10;
    }
    #menu-inner {
      background: #1a1a1a;
      border: 1px solid #333;
      padding: 20px 28px 16px;
      min-width: 320px;
      max-height: 80vh;
      overflow-y: auto;
    }
    #menu-items {
      list-style: none;
    }
    #menu-items li {
      font: 14px monospace;
      padding: 7px 10px;
      border-left: 2px solid transparent;
    }
    #menu-items li.section-header {
      color: #ffe000;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 14px 10px 4px;
      cursor: default;
      border-left: none;
    }
    #menu-items li.section-header:first-child { padding-top: 2px; }
    #menu-items li.action {
      color: #777;
      cursor: pointer;
    }
    #menu-items li.action:hover { color: #ccc; background: #222; }
    #menu-items li.action.selected {
      color: #ffe000;
      background: #222;
      border-left-color: #ffe000;
    }
    #menu-items li .tag {
      font-size: 10px;
      color: #555;
      margin-left: 8px;
    }
    #menu-hint {
      color: #444;
      font: 11px monospace;
      margin-top: 12px;
      border-top: 1px solid #222;
      padding-top: 10px;
    }
    #startup-hint {
      position: fixed;
      top: 10px; left: 0; right: 0;
      padding: 0 56px;
      text-align: center;
      color: #aaa;
      font: 16px monospace;
      pointer-events: none;
      transition: opacity 0.5s;
    }
  </style>
</head>
